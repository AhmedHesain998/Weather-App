<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="search">
            <input type="text" placeholder="Enter country or city name" spellcheck="false">

            <button>
                <img src="images/search.png" alt="search">
            </button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="weather">

            <img src="images/rain.png" class="weather-icon" alt="weather">

            <h1 class="temp">22°C</h1>
            <h2 class="city">Khartoum</h2>

            <div class="details">

                <div class="col">
                    <img src="images/humidity.png" alt="humidity">

                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/wind.png" alt="wind">

                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>

    const apiKey = "1862048fcccd6a1608f27c080f4d7453";

    const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");

    async function checkWeather(city) {

        if (!city || city.trim() === "") return;

        console.log("Calling API for:", city);

        try {

            const response = await fetch(
                `${apiUrl}${city}&appid=${apiKey}`
            );

            console.log("Response:", response);

            const data = await response.json();

            console.log("Data:", data);

            if (data.cod == "404") {
                document.querySelector(".error").style.display = "block";
                document.querySelector(".weather").style.display = "none";
                return;
            }

            document.querySelector(".city").innerHTML = data.name;

            document.querySelector(".temp").innerHTML =
                Math.round(data.main.temp) + "°C";

            document.querySelector(".humidity").innerHTML =
                data.main.humidity + "%";

            document.querySelector(".wind").innerHTML =
                data.wind.speed + " km/h";

            const weatherMain = data.weather[0].main;

            if (weatherMain == "Clouds") {
                weatherIcon.src = "images/clouds.png";
            }

            else if (weatherMain == "Clear") {
                weatherIcon.src = "images/clear.png";
            }

            else if (weatherMain == "Rain") {
                weatherIcon.src = "images/rain.png";
            }

            else if (weatherMain == "Drizzle") {
                weatherIcon.src = "images/drizzle.png";
            }

            else if (weatherMain == "Mist") {
                weatherIcon.src = "images/mist.png";
            }

            document.querySelector(".weather").style.display = "block";
            document.querySelector(".error").style.display = "none";

        }

        catch (error) {
            console.log("Fetch Error:", error);
        }
    }

    searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value);
    });

    searchBox.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
            checkWeather(searchBox.value);
        }

    });

</script>

</body>

</html>
